<style>
  .cd-wrap{ max-width:560px; margin:0 auto; padding:14px 16px 40px; }
  .cd-top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:0 0 12px; } .cd-top h1{ margin:0; font-size:20px; }
  .cd-hero{ padding:20px; border-radius:22px; border:1.5px solid var(--accent); background:linear-gradient(135deg,var(--accent-tint),var(--surface)); text-align:center; margin:0 0 12px; }
  .cd-hero .n{ font-size:clamp(64px,24vw,104px); font-weight:900; line-height:1; color:var(--accent-dark); font-variant-numeric:tabular-nums; }
  .cd-hero .u{ font-size:17px; font-weight:800; } .cd-hero p{ margin:6px 0 0; color:var(--muted); font-size:14px; }
  .cd-clock{ display:flex; gap:8px; justify-content:center; margin:12px 0 0; } .cd-clock div{ min-width:64px; padding:8px 6px; border-radius:12px; background:var(--surface); border:1px solid var(--line); } .cd-clock b{ display:block; font-size:22px; font-variant-numeric:tabular-nums; } .cd-clock span{ font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); }
  .cd-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; margin:0 0 6px; border-radius:14px; border:1px solid var(--line); border-left:6px solid var(--gc,var(--accent)); background:var(--surface); }
  .cd-row b{ display:block; font-size:15.5px; } .cd-row small{ color:var(--muted); font-size:12.5px; }
  .cd-row .d{ text-align:right; white-space:nowrap; } .cd-row .d i{ font-style:normal; display:block; font-size:24px; font-weight:900; color:var(--accent-dark); line-height:1; font-variant-numeric:tabular-nums; } .cd-row .d span{ font-size:11px; font-weight:800; text-transform:uppercase; color:var(--muted); }
  .cd-row.today .d i{ color:var(--incorrect,#b91c1c); }
  .cd-box{ padding:12px 16px; border-radius:14px; border:1.5px solid var(--accent); background:var(--accent-tint); margin:0 0 12px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .cd-steps{ margin:0 0 12px; padding:12px 16px 12px 34px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-size:14.5px; } .cd-steps li{ margin:5px 0; }
  .cd-empty{ padding:22px; text-align:center; color:var(--muted); border:1.5px dashed var(--line); border-radius:14px; margin:0 0 12px; }
  .cd-login{ display:grid; gap:8px; margin:0 0 12px; padding:14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); } .cd-login input{ padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); font:inherit; }
  .cd-foot a{ color:var(--accent-dark); font-weight:700; } .cd-foot{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:14px; font-size:14px; } .cd-more{ width:100%; margin:4px 0 8px; }
  .g-Sciences{ --gc:#16a34a } .g-Mathematics{ --gc:#2563eb } .g-Computing{ --gc:#7c3aed } .g-Languages{ --gc:#d97706 } .g-Humanities{ --gc:#db2777 }
</style>

<body>
<div class="cd-wrap">
  <div class="cd-top"><h1>Exam countdown</h1><span class="tt-hint" style="color:var(--muted);font-size:13px">IGCSE May/June 2027</span></div>
  <div class="cd-box hidden" id="cd-install"><div><b>Keep this on your Home screen</b><div style="font-size:13px;color:var(--muted)">Open it like an app. Finished exams drop off the list by themselves.</div></div><button class="btn btn-primary" id="btn-install" type="button">Add to Home screen</button></div>
  <ol class="cd-steps hidden" id="cd-steps"></ol>
  <div class="cd-login hidden" id="cd-login"><b>Log in to load your timetable</b><input type="email" id="cl-email" placeholder="Email" autocomplete="email" aria-label="Email"><input type="password" id="cl-pass" placeholder="Password" autocomplete="current-password" aria-label="Password"><button class="btn btn-primary" id="cl-go" type="button">Log in</button><span id="cl-st" role="alert" style="font-size:13px;color:var(--muted);min-height:1.2em"></span></div>
  <div id="cd-out" aria-live="polite"></div>
  <div class="cd-foot"><a href="exam-timetable.html">Open my full timetable</a><a href="quiz.html">iLearnCS home</a></div>
</div>
