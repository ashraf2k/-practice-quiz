<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#146C6A" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<title>iLearn</title>
<link rel="stylesheet" href="shared.css?v=20261014a" />
<style>
  .ln-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .ln-hero{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .ln-ring{ position:relative; width:84px; height:84px; flex:0 0 auto; }
  .ln-ring svg{ transform:rotate(-90deg); }
  .ln-ring .trk{ fill:none; stroke:var(--line); }
  .ln-ring .fil{ fill:none; stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s; }
  .ln-ring b{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:19px; }
  .ln-hero-body{ flex:1 1 240px; min-width:0; }
  .ln-hero-body h2{ margin:0 0 4px; font-size:18px; }
  .ln-muted{ color:var(--muted); font-size:13.5px; margin:0 0 8px; }
  .ln-bars{ display:grid; gap:8px; margin:14px 0 4px; }
  .ln-bar-row{ display:grid; grid-template-columns:150px 1fr auto; gap:10px; align-items:center; font-size:13px; }
  .ln-bar{ height:9px; border-radius:5px; background:var(--line); overflow:hidden; }
  .ln-bar i{ display:block; height:100%; background:var(--accent); border-radius:5px; transition:width .5s; }
  .ln-tabs{ display:flex; gap:8px; margin:18px 0 12px; flex-wrap:wrap; }
  .ln-tab{ flex:1 1 200px; padding:11px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; font-weight:700; cursor:pointer; text-align:left; }
  .ln-tab small{ display:block; font-weight:400; color:var(--muted); margin-top:2px; }
  .ln-tab[aria-selected="true"]{ border-color:var(--accent); background:var(--accent-tint); }
  .ln-topic{ border:1px solid var(--line); border-radius:10px; margin-bottom:10px; background:var(--surface); overflow:hidden; }
  .ln-topic > summary{ list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:800; background:var(--accent-tint); }
  .ln-topic > summary::-webkit-details-marker{ display:none; }
  .ln-topic > summary .cnt{ font-weight:600; font-size:12.5px; color:var(--muted); white-space:nowrap; }
  .ln-sec{ padding:8px 16px 4px; font-size:12.5px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; border-top:1px solid var(--line); }
  .ln-unit{ padding:9px 16px; border-top:1px solid var(--line); }
  .ln-unit-head{ display:flex; gap:10px; align-items:baseline; font-size:13.5px; }
  .ln-code{ font-weight:800; color:var(--accent-dark); flex:0 0 auto; }
  .ln-soon{ margin-left:auto; font-size:12px; font-weight:700; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 10px; white-space:nowrap; }
  .ln-lessons{ display:grid; gap:6px; margin:8px 0 2px 0; }
  .ln-lesson{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
  .ln-lesson:hover:not(:disabled){ border-color:var(--accent); }
  .ln-lesson:disabled{ opacity:.55; cursor:not-allowed; }
  .ln-lesson.cur{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-tint); }
  .ln-dot{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; border:2px solid var(--line); color:var(--muted); }
  .ln-lesson.done .ln-dot{ background:var(--correct); border-color:var(--correct); color:#fff; }
  .ln-lesson.cur .ln-dot{ border-color:var(--accent); color:var(--accent); }
  .ln-tag{ margin-left:auto; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .ln-tag.m{ background:var(--correct-bg); color:var(--correct); }
  .ln-tag.r{ background:var(--diff-moderate-bg); color:var(--diff-moderate); }
  .ln-crumb{ font-size:12.5px; color:var(--muted); margin:0 0 6px; }
  .ln-steps{ display:flex; gap:6px; margin:10px 0 16px; }
  .ln-step{ flex:1; text-align:center; font-size:12px; font-weight:700; padding:6px 4px; border-radius:6px; background:var(--bg); color:var(--muted); border:1px solid var(--line); }
  .ln-step.on{ background:var(--accent-tint); color:var(--accent-dark); border-color:var(--accent); }
  .ln-step.ok{ background:var(--correct-bg); color:var(--correct); border-color:var(--correct-line); }
  .ln-body{ font-size:15.5px; line-height:1.6; }
  .ln-body p{ margin:0 0 12px; } .ln-body ul{ margin:0 0 12px 20px; padding:0; } .ln-body li{ margin:4px 0; }
  .ln-body code{ background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.92em; }
  .ln-pre{ background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 14px; overflow-x:auto; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; line-height:1.5; }
  .ln-table{ border-collapse:collapse; margin:0 0 12px; font-size:14px; max-width:100%; }
  .ln-table th, .ln-table td{ border:1px solid var(--line); padding:6px 11px; text-align:center; }
  .ln-table th{ background:var(--bg); }
  .ln-box{ border:1px solid var(--line); border-left:5px solid var(--accent); border-radius:10px; padding:14px 16px; margin:0 0 14px; background:var(--surface); }
  .ln-box h3{ margin:0 0 8px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-dark); }
  .ln-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .ln-q{ font-size:16.5px; font-weight:700; margin:0 0 12px; }
  .ln-opts{ display:grid; gap:9px; }
  .ln-opt{ display:flex; gap:12px; align-items:center; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer; }
  .ln-opt:hover:not(:disabled){ border-color:var(--accent); }
  .ln-opt .l{ flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .ln-opt.right{ border-color:var(--correct); background:var(--correct-bg); }
  .ln-opt.wrong{ border-color:var(--incorrect); background:var(--incorrect-bg); }
  .ln-fb{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14.5px; }
  .ln-fb.ok{ background:var(--correct-bg); border:1px solid var(--correct-line); }
  .ln-fb.no{ background:var(--incorrect-bg); border:1px solid var(--incorrect-line); }
  .ln-done{ text-align:center; padding:8px 0 4px; }
  .ln-done .big{ font-size:46px; line-height:1; }
  .ln-done h2{ margin:8px 0 6px; }
  .ln-notice{ text-align:center; color:var(--muted); padding:30px 0; }
  @media (max-width:520px){ .ln-bar-row{ grid-template-columns:1fr; gap:4px; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <header class="top">
    <a class="logo-link" href="index.html" aria-label="iLearnCS home"><img class="logo-img" src="logo.png" alt="iLearnCS"></a>
    <div><h1>iLearn</h1><p id="header-sub">Your step-by-step learning journey</p></div>
  </header>

  <!-- ============ JOURNEY (home) ============ -->
  <section id="view-journey" class="card hidden">
    <div class="ln-top">
      <h2 class="step-title" style="margin:0;">My learning journey</h2>
      <a class="link-btn" href="quiz.html#menu">← iLearn / iSolve menu</a>
    </div>
    <div class="ln-hero">
      <div class="ln-ring"><svg width="84" height="84" viewBox="0 0 84 84"><circle class="trk" cx="42" cy="42" r="36" stroke-width="8"></circle><circle class="fil" id="ring-fill" cx="42" cy="42" r="36" stroke-width="8" stroke-dasharray="226.2" stroke-dashoffset="226.2"></circle></svg><b id="ring-pct">0%</b></div>
      <div class="ln-hero-body">
        <h2 id="hero-title">Welcome</h2>
        <p class="ln-muted" id="hero-sub"></p>
        <button class="btn btn-primary" id="btn-continue" type="button">Continue learning</button>
      </div>
    </div>
    <div class="ln-bars" id="bars"></div>
    <div class="ln-tabs" role="tablist" id="tabs"></div>
    <div id="topics"></div>
  </section>

  <!-- ============ LESSON ============ -->
  <section id="view-lesson" class="card hidden">
    <div class="ln-top">
      <p class="ln-crumb" id="crumb"></p>
      <button class="link-btn" id="btn-leave" type="button">← Back to journey</button>
    </div>
    <h2 class="step-title" id="lesson-title" style="margin-top:0;"></h2>
    <div class="ln-steps" id="steps"></div>
    <div id="lesson-body"></div>
  </section>

  <section id="view-wait" class="card"><p class="ln-notice">Loading your journey…</p></section>
</div>

<script src="syllabus-objectives.js?v=20261014a"></script>
<script src="learn-data.js?v=20261014a"></script>
<script src="firebase-config.js?v=20261014a"></script>
<script type="module" src="firebase-init.js?v=20261014a"></script>
<script type="module">
(function(){
  "use strict";
  var S = window.SYLLABUS_OBJECTIVES, O = S.OBJECTIVES;
  var PAPERS = [
    { id:1, title:"Paper 1", sub:"Theory · Computer systems (topics 1–6)", topics:[1,2,3,4,5,6] },
    { id:2, title:"Paper 2", sub:"Programming and logic (topics 7–10)", topics:[7,8,9,10] }
  ];
  var PROGRESS_KEY = "ilearn";
  var user = null, progress = {};      // progress[lessonId] = { d:1, f:1|0, a:attempts }
  var activeTab = 1, current = null;   // current lesson run state

  function $(id){ return document.getElementById(id); }
  function esc(x){ return String(x == null ? "" : x).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function show(id){ ["view-journey","view-lesson","view-wait"].forEach(function(v){ $(v).classList.toggle("hidden", v !== id); }); window.scrollTo(0, 0); }

  // ---------- syllabus order ----------
  var CODES = Object.keys(O);                          // objective codes, in syllabus order
  var CODE_INDEX = {}; CODES.forEach(function(c, i){ CODE_INDEX[c] = i; });
  var LESSONS = window.ILEARN_LESSONS.map(function(l, i){ return { l: l, i: i }; })
    .sort(function(a, b){ var d = (CODE_INDEX[a.l.code] || 0) - (CODE_INDEX[b.l.code] || 0); return d || (a.i - b.i); })
    .map(function(x){ return x.l; });
  var LESSON_BY_ID = {}; LESSONS.forEach(function(l){ LESSON_BY_ID[l.id] = l; });
  function lessonsOf(code){ return LESSONS.filter(function(l){ return l.code === code; }); }

  function isDone(id){ return !!(progress[id] && progress[id].d); }
  function currentLesson(){ for(var i = 0; i < LESSONS.length; i++){ if(!isDone(LESSONS[i].id)) return LESSONS[i]; } return null; }
  function isUnlocked(l){
    if(isDone(l.id)) return true;
    var cur = currentLesson();
    return !!cur && cur.id === l.id;
  }
  function codeCovered(code){ var ls = lessonsOf(code); return ls.length > 0 && ls.every(function(l){ return isDone(l.id); }); }

  // ---------- persistence (Firestore via practiceProgress, with a local copy) ----------
  function localKey(){ return "ilearn_v1_" + (user && user.uid); }
  function loadProgress(){
    var local = {};
    try { local = JSON.parse(localStorage.getItem(localKey()) || "{}").learn || {}; } catch(e){}
    var p = (PQFirebase.getMyProgress ? PQFirebase.getMyProgress(user.uid, PROGRESS_KEY) : Promise.resolve(null));
    return p.then(function(rec){ return (rec && rec.learn) || {}; }).catch(function(){ return {}; })
      .then(function(remote){
        var merged = {};
        [local, remote].forEach(function(src){ Object.keys(src).forEach(function(k){
          var a = merged[k], b = src[k];
          if(!a || (b.d && !a.d) || (b.d && a.d && (b.f || 0) > (a.f || 0))) merged[k] = b;
        }); });
        return merged;
      });
  }
  function saveProgress(){
    var done = LESSONS.filter(function(l){ return isDone(l.id); }).length;
    var snap = { learn: progress, learnDone: done, learnTotal: LESSONS.length };
    try { localStorage.setItem(localKey(), JSON.stringify(snap)); } catch(e){}
    if(PQFirebase.saveProgress) PQFirebase.saveProgress(user.uid, PROGRESS_KEY, snap);
  }

  // ---------- journey ----------
  function pct(a, b){ return b ? Math.round(a / b * 100) : 0; }

  function topicTree(){
    var topics = {};
    CODES.forEach(function(code){
      var name = O[code][0], tn = parseInt(name, 10);
      var t = topics[tn] || (topics[tn] = { num: tn, title: S.TOPICS[tn], secs: [], secBy: {} });
      var sec = t.secBy[name];
      if(!sec){ sec = t.secBy[name] = { name: name, units: [] }; t.secs.push(sec); }
      sec.units.push({ code: code, text: O[code][1] });
    });
    return topics;
  }

  function renderJourney(){
    var tree = topicTree();
    var doneL = LESSONS.filter(function(l){ return isDone(l.id); }).length;
    var overall = pct(doneL, LESSONS.length);
    $("ring-pct").textContent = overall + "%";
    $("ring-fill").style.strokeDashoffset = String(226.2 * (1 - overall / 100));
    var cur = currentLesson();
    $("hero-title").textContent = "Hi " + user.name + (doneL ? ", keep going!" : ", let's begin!");
    $("hero-sub").textContent = doneL + " of " + LESSONS.length + " lessons completed so far. New lessons are added topic by topic, following the syllabus order.";
    $("btn-continue").textContent = cur ? (doneL ? "Continue: " : "Start: ") + cur.code + " " + cur.title : "All current lessons complete 🎉";
    $("btn-continue").disabled = !cur;

    var bars = "";
    PAPERS.forEach(function(p){
      var codes = CODES.filter(function(c){ return p.topics.indexOf(parseInt(O[c][0], 10)) !== -1; });
      var cov = codes.filter(codeCovered).length;
      bars += '<div class="ln-bar-row"><span><b>' + p.title + "</b> syllabus covered</span><span class='ln-bar'><i style='width:" + pct(cov, codes.length) + "%'></i></span><span>" + cov + " / " + codes.length + " objectives</span></div>";
    });
    $("bars").innerHTML = bars;

    var tabs = "";
    PAPERS.forEach(function(p){ tabs += '<button class="ln-tab" role="tab" data-p="' + p.id + '" aria-selected="' + (p.id === activeTab) + '">' + p.title + " · " + (p.id === 1 ? "Theory" : "Programming and logic") + "<small>" + p.sub + "</small></button>"; });
    $("tabs").innerHTML = tabs;
    Array.prototype.forEach.call($("tabs").querySelectorAll(".ln-tab"), function(b){ b.addEventListener("click", function(){ activeTab = Number(b.getAttribute("data-p")); renderJourney(); }); });

    var paper = PAPERS.filter(function(p){ return p.id === activeTab; })[0];
    var h = "";
    paper.topics.forEach(function(tn){
      var t = tree[tn]; if(!t) return;
      var codes = []; t.secs.forEach(function(s){ s.units.forEach(function(u){ codes.push(u.code); }); });
      var cov = codes.filter(codeCovered).length;
      var hasCur = cur && codes.indexOf(cur.code) !== -1;
      h += '<details class="ln-topic"' + (hasCur ? " open" : "") + "><summary><span>" + tn + " " + esc(t.title) + '</span><span class="cnt">' + cov + " / " + codes.length + " objectives</span></summary>";
      t.secs.forEach(function(sec){
        h += '<div class="ln-sec">' + esc(sec.name) + "</div>";
        sec.units.forEach(function(u){
          var ls = lessonsOf(u.code);
          h += '<div class="ln-unit"><div class="ln-unit-head"><span class="ln-code">' + esc(u.code) + "</span><span>" + esc(u.text) + "</span>" + (ls.length ? "" : '<span class="ln-soon">Coming soon</span>') + "</div>";
          if(ls.length){
            h += '<div class="ln-lessons">';
            ls.forEach(function(l){
              var done = isDone(l.id), ok = isUnlocked(l), isCur = cur && cur.id === l.id;
              var rec = progress[l.id];
              h += '<button class="ln-lesson' + (done ? " done" : "") + (isCur ? " cur" : "") + '" data-l="' + l.id + '"' + (ok ? "" : " disabled") + '><span class="ln-dot">' + (done ? "✓" : (ok ? "▶" : "🔒")) + "</span><span>" + esc(l.title) + "</span>" +
                (done ? (rec.f ? '<span class="ln-tag m">Mastered</span>' : '<span class="ln-tag r">↻ Review later</span>') : (isCur ? '<span class="ln-tag m">Up next</span>' : "")) + "</button>";
            });
            h += "</div>";
          }
          h += "</div>";
        });
      });
      h += "</details>";
    });
    $("topics").innerHTML = h;
    Array.prototype.forEach.call($("topics").querySelectorAll(".ln-lesson"), function(b){ b.addEventListener("click", function(){ openLesson(b.getAttribute("data-l")); }); });
    $("header-sub").textContent = "Your step-by-step learning journey";
    show("view-journey");
  }

  $("btn-continue").addEventListener("click", function(){ var c = currentLesson(); if(c) openLesson(c.id); });

  // ---------- lesson ----------
  var STEPS = ["Learn", "Example", "Check", "Done"];
  function renderSteps(active, allDone){
    $("steps").innerHTML = STEPS.map(function(s, i){
      var cls = "ln-step" + (i === active ? " on" : "") + ((i < active || allDone) ? " ok" : "");
      return '<div class="' + cls + '">' + (i + 1) + ". " + s + "</div>";
    }).join("");
  }
  function openLesson(id){
    var l = LESSON_BY_ID[id]; if(!l) return;
    current = { l: l, step: 0, ci: 0, wrongs: 0, wrongTotal: 0, order: null };
    $("crumb").textContent = O[l.code][0] + "  ›  " + l.code;
    $("lesson-title").textContent = l.title;
    renderLesson();
    show("view-lesson");
  }
  function leave(){ renderJourney(); }
  $("btn-leave").addEventListener("click", leave);

  function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function renderLesson(){
    var c = current, l = c.l, body = $("lesson-body"), h = "";
    if(c.step === 0){
      renderSteps(0);
      h = '<div class="ln-box"><h3>Syllabus objective ' + esc(l.code) + "</h3><div>" + esc(O[l.code][1]) + '</div></div><div class="ln-body">' + l.concept + '</div><div class="ln-actions"><button class="btn btn-primary" id="b-next" type="button">Show me an example →</button></div>';
    } else if(c.step === 1){
      renderSteps(1);
      h = '<div class="ln-body"><div class="ln-box"><h3>Worked example</h3>' + l.example + '</div></div><div class="ln-actions"><button class="btn btn-secondary" id="b-back" type="button">← Re-read the idea</button><button class="btn btn-primary" id="b-next" type="button">Check my understanding →</button></div>';
    } else if(c.step === 2){
      renderSteps(2);
      var q = l.checks[c.ci];
      if(!c.order) c.order = shuffle(q.options.map(function(o, i){ return i; }));
      h = '<p class="ln-crumb">Question ' + (c.ci + 1) + " of " + l.checks.length + '</p><p class="ln-q">' + esc(q.q) + '</p><div class="ln-opts" id="opts">' +
        c.order.map(function(oi, k){ return '<button class="ln-opt" data-o="' + oi + '" type="button"><span class="l">' + "ABCD".charAt(k) + "</span><span>" + esc(q.options[oi]) + "</span></button>"; }).join("") + '</div><div id="fb"></div>';
    } else {
      renderSteps(3, true);
      var rec = progress[l.id], nextL = currentLesson();
      var mastered = rec && rec.f;
      h = '<div class="ln-done"><div class="big">' + (mastered ? "🌟" : "✅") + "</div><h2>" + (mastered ? "Mastered first time!" : "Lesson complete") + "</h2><p class='ln-muted'>" +
        (mastered ? "You answered every question correctly at the first attempt. This idea is secure." : "You got there in the end. This idea is marked to <b>review later</b>, so come back to it before your exam.") + "</p></div>" +
        '<div class="ln-box"><h3>Key idea to remember</h3><div class="ln-body">' + keyIdea(l) + '</div></div><div class="ln-actions" style="justify-content:center">' +
        (nextL ? '<button class="btn btn-primary" id="b-next" type="button">Next: ' + esc(nextL.code + " " + nextL.title) + " →</button>" : "") +
        '<button class="btn btn-secondary" id="b-journey" type="button">Back to journey</button></div>';
    }
    body.innerHTML = h;
    var bn = $("b-next"), bb = $("b-back"), bj = $("b-journey");
    if(c.step < 2){
      if(bn) bn.addEventListener("click", function(){ c.step++; c.order = null; renderLesson(); window.scrollTo(0, 0); });
      if(bb) bb.addEventListener("click", function(){ c.step--; renderLesson(); window.scrollTo(0, 0); });
    }
    if(c.step === 2){
      Array.prototype.forEach.call($("opts").querySelectorAll(".ln-opt"), function(b){ b.addEventListener("click", function(){ answer(Number(b.getAttribute("data-o"))); }); });
    }
    if(c.step === 3){
      if(bn) bn.addEventListener("click", function(){ var n = currentLesson(); if(n) openLesson(n.id); });
      if(bj) bj.addEventListener("click", leave);
    }
  }
  function keyIdea(l){ var q = l.checks[l.checks.length - 1]; return esc(q.explain); }

  function answer(oi){
    var c = current, q = c.l.checks[c.ci], opts = $("opts"), fb = $("fb");
    var ok = (oi === q.correct);
    Array.prototype.forEach.call(opts.querySelectorAll(".ln-opt"), function(b){
      b.disabled = true;
      var o = Number(b.getAttribute("data-o"));
      if(o === oi) b.classList.add(ok ? "right" : "wrong");
      if(ok && o === q.correct) b.classList.add("right");
    });
    if(ok){
      fb.innerHTML = '<div class="ln-fb ok"><b>Correct.</b> ' + esc(q.explain) + '</div><div class="ln-actions"><button class="btn btn-primary" id="b-cont" type="button">' + (c.ci + 1 < c.l.checks.length ? "Next question →" : "Finish lesson →") + "</button></div>";
      $("b-cont").addEventListener("click", function(){
        c.wrongs = 0; c.order = null;
        if(c.ci + 1 < c.l.checks.length){ c.ci++; renderLesson(); return; }
        progress[c.l.id] = { d: 1, f: c.wrongTotal === 0 ? 1 : 0, a: c.wrongTotal + 1 };
        saveProgress(); c.step = 3; renderLesson(); window.scrollTo(0, 0);
      });
    } else {
      c.wrongs++; c.wrongTotal++;
      var again = c.wrongs >= 2
        ? '<p>Let\'s go back and read the idea again before the next try.</p><div class="ln-actions"><button class="btn btn-primary" id="b-review" type="button">Re-read the idea</button></div>'
        : '<div class="ln-actions"><button class="btn btn-primary" id="b-retry" type="button">Try again</button></div>';
      fb.innerHTML = '<div class="ln-fb no"><b>Not quite.</b> Think about it again, then have another go.</div>' + again;
      if($("b-retry")) $("b-retry").addEventListener("click", function(){ c.order = null; renderLesson(); });
      if($("b-review")) $("b-review").addEventListener("click", function(){ c.step = 0; c.order = null; c.wrongs = 0; c.reviewReturn = true; renderLesson(); window.scrollTo(0, 0); });
    }
  }

  // ---------- start ----------
  PQFirebase.onAuthChange(function(u){
    if(!u){ window.location.href = "quiz.html"; return; }
    user = u;
    var cls = String(u.class || "");
    if(!/^10BR/i.test(cls)){ $("view-wait").innerHTML = '<p class="ln-notice">iLearn is opening for your class soon.</p><p style="text-align:center"><a class="link-btn" href="quiz.html">← Back to practice</a></p>'; show("view-wait"); return; }
    loadProgress().then(function(p){ progress = p; renderJourney(); });
  });
})();
</script>
